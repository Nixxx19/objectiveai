[package]
name = "objectiveai-pyo3"
version = "0.1.5"
edition = "2024"
authors = ["ObjectiveAI <admin@objective-ai.io>"]
description = "Python bindings for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objective-ai.io"
readme = "README.md"
keywords = ["llm", "ai", "ensemble", "python"]
publish = true

[lib]
name = "objectiveai_pyo3"
crate-type = ["cdylib"]

[dependencies]
arbitrary = "1.4.2"
objectiveai = { path = "../objectiveai-rs", version = "0.1.5", default-features = false }
pyo3 = { version = "0.28", features = ["extension-module"] }
pythonize = "0.28"
rand = "0.9.2"
rust_decimal = { version = "1.39.0", features = ["serde-float"] }
serde = "1.0.228"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
