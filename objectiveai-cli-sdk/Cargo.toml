[package]
name = "objectiveai-cli-sdk"
version = "2.0.5"
edition = "2024"
authors = ["ObjectiveAI <admin@objectiveai.dev>"]
description = "Library surface for objectiveai-cli: structured JSON Lines output types."
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objectiveai.dev"
documentation = "https://docs.rs/objectiveai-cli-sdk"
readme = "README.md"
keywords = ["llm", "ai", "swarm", "cli"]
publish = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
objectiveai-sdk = { path = "../objectiveai-sdk-rs", version = "2.0.5", default-features = false, features = ["filesystem"] }
indexmap = { version = "2.13.0", features = ["serde"] }
tokio = { version = "1.50.0", features = ["process", "sync", "io-util"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
