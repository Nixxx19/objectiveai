name: Build objectiveai-mcp-filesystem
description: Cross-compile objectiveai-mcp-filesystem for a Linux musl target and stage embed/, then upload the result as an artifact named per-caller.

inputs:
  target:
    description: Rust target triple (x86_64-unknown-linux-musl or aarch64-unknown-linux-musl).
    required: true
  artifact-name:
    description: Per-leg artifact name so each caller uploads its own slot — supports the per-leg-job model where every CLI leg has its own dedicated mcp-filesystem builder.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}
    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Build mcp-filesystem
      shell: bash
      run: cross build -p objectiveai-mcp-filesystem --target ${{ inputs.target }} --release
    - name: Stage embed directory with fingerprint
      # Compute the same fingerprint that build.sh would write so the
      # downstream install.sh invocation on the CLI build job skips the
      # mcp-filesystem rebuild step (fingerprint match → no-op).
      shell: bash
      run: |
        EMBED_DIR="objectiveai-mcp-filesystem/embed/${{ inputs.target }}/release"
        mkdir -p "$EMBED_DIR"
        cp "target/${{ inputs.target }}/release/objectiveai-mcp-filesystem" "$EMBED_DIR/"
        source objectiveai-mcp-filesystem/fingerprint.sh --target ${{ inputs.target }} --release
        echo "$CURRENT_FP" > "$EMBED_DIR/.fingerprint"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: objectiveai-mcp-filesystem/embed/${{ inputs.target }}/release/
        if-no-files-found: error
        # `.fingerprint` is a hidden dotfile that's required for the
        # CLI build to short-circuit the mcp-filesystem rebuild step.
        include-hidden-files: true
