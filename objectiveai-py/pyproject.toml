[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "objectiveai"
version = "2.0.0"
description = "Python SDK for the ObjectiveAI API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "ObjectiveAI", email = "admin@objectiveai.dev" },
]
keywords = ["objectiveai", "ai", "llm", "agents", "swarm", "judgment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<1",
  "objectiveai_pyo3>=2.0,<3",
]

[project.urls]
Homepage = "https://objectiveai.dev"
Repository = "https://github.com/ObjectiveAI/objectiveai"
Issues = "https://github.com/ObjectiveAI/objectiveai/issues"

[tool.hatch.build.targets.wheel]
packages = ["objectiveai"]

[tool.hatch.build.targets.sdist]
include = [
  "objectiveai/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
