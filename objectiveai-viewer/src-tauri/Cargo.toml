[package]
name = "objectiveai-viewer"
version = "2.0.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
dotenv = "0.15.0"
envconfig = "0.11.1"
objectiveai = { version = "2.0.0", path = "../../objectiveai-rs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = "2.10.3"
tokio = { version = "1.50.0", features = ["full"] }

[build-dependencies]
tauri-build = "2.5.6"
