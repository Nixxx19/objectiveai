[package]
name = "objectiveai-wasm-js"
version = "0.1.5"
edition = "2024"
authors = ["ObjectiveAI <admin@objective-ai.io>"]
description = "JavaScript WebAssembly bindings for ObjectiveAI"
license = "MIT"
repository = "https://github.com/ObjectiveAI/objectiveai"
homepage = "https://objective-ai.io"
documentation = "https://docs.rs/objectiveai-wasm-js"
readme = "README.md"
keywords = ["llm", "ai", "ensemble"]
publish = true

[lib]
crate-type = ["cdylib"]

[dependencies]
objectiveai = { path = "../objectiveai-rs", version = "0.1.5", default-features = false }
wasm-bindgen = { version = "0.2.105" }
serde-wasm-bindgen = { version = "0.6.5" }
rust_decimal = { version = "1.39.0", features = ["serde-float"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
arbitrary = "1.4.2"
rand = { version = "0.9.2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
