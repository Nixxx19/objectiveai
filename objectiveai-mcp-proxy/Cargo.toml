[package]
name = "objectiveai-mcp-proxy"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
dashmap = "6.1.0"
dotenv = "0.15.0"
envconfig = "0.11.1"
futures = "0.3.32"
# objectiveai brings the in-tree MCP client (Client / Connection / wire types).
# default-features = false skips the heavy filesystem feature (vendored libgit2)
# so this crate stays cheap to build.
objectiveai = { path = "../objectiveai-rs", version = "2.0.0", default-features = false, features = ["mcp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
